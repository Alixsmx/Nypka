name: ZIP → APK
on:
  push:
    branches: ['**']
    paths: ['*.zip', '*.tar.bz2', '*.tar.gz']
  workflow_dispatch:
    inputs:
      archive:
        description: Nazwa archiwum w repo (puste = ostatnio wrzucone)
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          lfs: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: b
        name: Rozpakuj i zbuduj APK
        env:
          ARCHIVE: ${{ inputs.archive }}
        run: |
          set -euo pipefail
          fail(){ echo "::error::$*"; exit 1; }
          usejava(){ v="JAVA_HOME_${1}_X64"; export JAVA_HOME="${!v}"; export PATH="$JAVA_HOME/bin:$PATH"; }
          ni(){ if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi; }
          gw(){ if [ -f gradle/wrapper/gradle-wrapper.jar ]; then sed -i 's/\r$//' gradlew; chmod +x gradlew; ./gradlew "$@" --no-daemon; else gradle "$@" --no-daemon; fi; }

          f="$ARCHIVE"
          [ -n "$f" ] || f=$(git -c core.quotepath=false diff-tree --no-commit-id --name-only -r HEAD | grep -E '^[^/]+\.(zip|tar\.bz2|tar\.gz)$' | tail -1 || true)
          [ -n "$f" ] || f=$(ls -1v *.zip *.tar.bz2 *.tar.gz 2>/dev/null | tail -1 || true)
          [ -f "$f" ] || fail "Nie ma archiwum (zip / tar.bz2 / tar.gz) w głównym folderze repo."
          base=$(echo "$f" | sed -E 's/\.(zip|tar\.bz2|tar\.gz)$//')
          echo "name=$base" >> "$GITHUB_OUTPUT"

          out="$GITHUB_WORKSPACE/out"; rm -rf "$out" /tmp/src; mkdir -p "$out" /tmp/src
          case "$f" in
            *.zip) unzip -q "$f" -d /tmp/src ;;
            *.tar.bz2) tar -xjf "$f" -C /tmp/src ;;
            *) tar -xzf "$f" -C /tmp/src ;;
          esac
          cd /tmp/src; rm -rf __MACOSX
          while [ "$(ls -A | wc -l)" = 1 ] && [ -d "$(ls -A)" ]; do cd "$(ls -A)"; done
          root=$PWD
          rm -f local.properties android/local.properties
          rm -rf "$GITHUB_WORKSPACE/work"; cp -a "$root" "$GITHUB_WORKSPACE/work"
          rm -rf "$GITHUB_WORKSPACE/work/.git" "$GITHUB_WORKSPACE/work/node_modules"

          if ls capacitor.config.* >/dev/null 2>&1; then
            kind=Capacitor
            cap=$(node -p "const p=require('./package.json');parseInt((({...p.devDependencies,...p.dependencies})['@capacitor/core']||'').replace(/^[^0-9]*/,''))||99")
            if [ "$cap" -ge 7 ]; then usejava 21; else usejava 17; fi
            ni; npm run build --if-present
            [ -d android ] || npx cap add android
            npx cap sync android
            cd android; gw assembleDebug
          elif [ -f gradlew ] || ls settings.gradle* >/dev/null 2>&1; then
            kind=Android; usejava 17
            gw assembleDebug
          elif [ -f index.html ] || [ -f package.json ]; then
            kind=Strona; usejava 21
            web=$root
            if [ -f package.json ]; then
              ni; npm run build --if-present
              for d in dist build out; do [ -f "$d/index.html" ] && { web="$root/$d"; break; }; done
            fi
            [ -f "$web/index.html" ] || fail "To nie wygląda na stronę ani aplikację: brak index.html (po buildzie też)."
            id=$(echo "$base" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9')
            rm -rf /tmp/app; mkdir /tmp/app; cd /tmp/app
            npm init -y >/dev/null
            npm i @capacitor/core @capacitor/cli @capacitor/android
            cp -r "$web" www
            npx cap init "$base" "com.build.app$id" --web-dir www
            npx cap add android
            cd android; gw assembleDebug
            root=/tmp/app
          else
            fail "Nie rozpoznano projektu (szukam: capacitor.config, gradlew/settings.gradle, index.html)."
          fi

          cd "$root"
          find . -path '*/outputs/apk/*' -name '*.apk' | while read -r a; do cp "$a" "$out/$base-$(basename "$a")"; done
          ls "$out"/*.apk >/dev/null 2>&1 || fail "Build przeszedł, ale nie znalazłem żadnego APK."
          echo "Zbudowano ($kind):"; ls -la "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: out/*.apk
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ steps.b.outputs.name }}
          files: out/*.apk
      - name: Rozpakowane pliki do work/
        if: always()
        env:
          N: ${{ steps.b.outputs.name }}
        run: |
          [ -d work ] || exit 0
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A work
          git diff --cached --quiet || { git commit -qm "work: $N [skip ci]"; git pull --rebase -q origin "$GITHUB_REF_NAME"; git push -q origin HEAD; }
